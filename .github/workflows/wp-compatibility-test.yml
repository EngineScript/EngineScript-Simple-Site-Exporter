      - name: Install Composer dependencies
        id: install_composer_dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: "--prefer-dist --no-progress"

      - name: Security Check for known vulnerabilities in dependencies
        id: security_check_for_known_vulnerabilities_in_dependencies
        uses: symfonycorp/security-checker-action@v5

      - name: WordPress Security Scan
        id: wordpress_security_scan
        run: |
          echo "Performing WordPress plugin security analysis..."

          # Basic security pattern checks for common WordPress vulnerabilities
          echo "Checking for common security issues..."
          security_findings=0

          grep_php() {
            grep -r "$1" \
              --include="*.php" \
              --exclude-dir=.github \
              --exclude-dir=build \
              --exclude-dir=coverage \
              --exclude-dir=plugin-check-build \
              --exclude-dir=stubs \
              --exclude-dir=tests \
              --exclude-dir=vendor \
              . 2>/dev/null
          }

          # Check for potential SQL injection patterns
          if grep_php "mysql_query\|mysqli_query"; then
            echo "::error::Direct database queries found. Ensure proper sanitization."
            security_findings=1
          fi

          # Check for potential XSS vulnerabilities (missing escaping)
          if grep_php "echo \$_\|print \$_"; then
            echo "::error::Potential XSS vulnerability found. Ensure output is escaped."
            security_findings=1
          fi

          # Check for file inclusion vulnerabilities
          if grep_php "include.*\$_\|require.*\$_"; then
            echo "::error::Potential file inclusion vulnerability found."
            security_findings=1
          fi

          # Check for eval() usage (security risk)
          if grep_php "eval("; then
            echo "::error::eval() function usage detected. This is a security risk."
            security_findings=1
          fi

          # Check for proper nonce usage
          if grep_php "wp_nonce_field\|wp_verify_nonce\|settings_fields" >/dev/null 2>&1; then
            echo "WordPress nonce usage detected."
          else
            echo "Info: Consider adding WordPress nonces for form security."
          fi

          # Check for proper sanitization functions
          if grep_php "sanitize_\|esc_" >/dev/null 2>&1; then
            echo "WordPress sanitization functions detected."
          else
            echo "::error::Limited use of WordPress sanitization functions."
            security_findings=1
          fi

          # Check for capability checks
          if grep_php "current_user_can\|user_can" >/dev/null 2>&1; then
            echo "WordPress capability checks detected."
          else
            echo "Info: Consider adding user capability checks where appropriate."
          fi

          if [ "$security_findings" -ne 0 ]; then
            echo "::error::WordPress security scan found blocking findings."
            exit 1
          fi

          echo "WordPress security scan completed."

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php_8_3=${{ steps.setup_php_8_3.outcome }}
            install_composer_dependencies=${{ steps.install_composer_dependencies.outcome }}
            security_check_for_known_vulnerabilities_in_dependencies=${{ steps.security_check_for_known_vulnerabilities_in_dependencies.outcome }}
            wordpress_security_scan=${{ steps.wordpress_security_scan.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/sse-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/sse-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/sse-diagnostics/run.txt"
          if command -v php >/dev/null; then
            php -r 'echo PHP_VERSION, PHP_EOL;' > "$RUNNER_TEMP/sse-diagnostics/php.txt"
          fi
          if command -v composer >/dev/null && [ -f vendor/composer/installed.json ]; then
            php -r '$data = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($data["packages"] ?? $data as $package) { echo $package["name"], " ", $package["version"], PHP_EOL; }' > "$RUNNER_TEMP/sse-diagnostics/dependencies.txt"
          fi
          # Never upload config, authentication data, SQL, exports, or arbitrary logs.
          # Refuse oversized or linked diagnostics instead of uploading them.
          find "$RUNNER_TEMP/sse-diagnostics" -type l -delete
          find "$RUNNER_TEMP/sse-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: wp-compat-security-check
          path: |
            ${{ runner.temp }}/sse-diagnostics/run.txt
            ${{ runner.temp }}/sse-diagnostics/steps.txt
            ${{ runner.temp }}/sse-diagnostics/php.txt
            ${{ runner.temp }}/sse-diagnostics/dependencies.txt
            ${{ runner.temp }}/sse-diagnostics/wordpress.txt
            ${{ runner.temp }}/sse-diagnostics/junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Create issue on security vulnerability
        id: create_issue_on_security_vulnerability
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@v2
        env:
