  wp-version-test:
    name: Test WordPress ${{ matrix.wp-version }} with PHP ${{ matrix.php-version }} (${{ matrix.dependency-versions }} deps)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        wp-version: ['6.8', 'latest', 'nightly']
        dependency-versions: ['highest']
        include:
          - php-version: '8.2'
            wp-version: 'latest'
            dependency-versions: 'lowest'
      fail-fast: false

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot --silent" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php-version }}
        id: setup_php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, curl, zip, intl, gd, mbstring, fileinfo, xml
          coverage: none
          tools: composer:v2

      - name: Use isolated Composer auth
        id: use_isolated_composer_auth
        run: |
          # Avoid inheriting a masked or malformed GitHub OAuth token from Composer auth.
          composer_home="${RUNNER_TEMP}/composer-home"
          composer_cache="${RUNNER_TEMP}/composer-cache"

          mkdir -p "$composer_home" "$composer_cache"

          {
            echo "COMPOSER_HOME=$composer_home"
            echo "COMPOSER_CACHE_DIR=$composer_cache"
            echo 'COMPOSER_AUTH={"github-oauth":{"github.com":"${{ github.token }}"}}'
          } >> "$GITHUB_ENV"

      - name: PHP syntax lint
        id: php_syntax_lint
        run: |
          find . \
            -path './vendor' -prune -o \
            -path './tests' -prune -o \
            -path './build' -prune -o \
            -path './plugin-check-build' -prune -o \
            -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install Subversion
        id: install_subversion
        timeout-minutes: 15
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install Composer dependencies
        id: install_composer_dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependency-versions }}
          composer-options: "--prefer-dist --no-progress"

      - name: Pin PHPUnit for WordPress test suite
        id: pin_phpunit_for_wordpress_test_suite
        run: |
          # The WordPress test library still calls PHPUnit APIs removed in PHPUnit 10+.
          # Keep this generated integration-test job on PHPUnit 9.6 while the rest
          # of the project can continue using newer Composer-resolved QA tooling.
          if [ "${{ matrix.dependency-versions }}" = "lowest" ]; then
            composer require --dev phpunit/phpunit:"^9.6" yoast/phpunit-polyfills:"^4.0" --with-all-dependencies --prefer-lowest --no-progress
          else
            composer require --dev phpunit/phpunit:"^9.6" yoast/phpunit-polyfills:"^4.0" --with-all-dependencies --no-progress
          fi

      - name: Verify PHPUnit dependency versions
        id: verify_phpunit_dependency_versions
        run: |
          composer show phpunit/phpunit
          composer show yoast/phpunit-polyfills
          vendor/bin/phpunit --version | grep -E '^PHPUnit 9\.6\.'

      - name: Prepare Database
        id: prepare_database
        run: |
          mysql -u root --password=root --host=127.0.0.1 --port=3306 -e "DROP DATABASE IF EXISTS wordpress_test;"
          mysqladmin -u root --password=root --host=127.0.0.1 --port=3306 --force create wordpress_test

      - name: Create tests directory structure
        id: create_tests_directory_structure
        run: |
          mkdir -p tests/bin
          mkdir -p tests/bootstrap

      - name: Create WP tests install script
        id: create_wp_tests_install_script
        run: |
          cat > tests/bin/install-wp-tests.sh << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          set +x
          umask 077
          
          if [ $# -lt 3 ]; then
            echo "usage: $0 <db-name> <db-user> <db-pass> [db-host] [wp-version] [skip-database-creation]"
            exit 1
          fi
          
          DB_NAME=$1
          DB_USER=$2
          DB_PASS=$3
          DB_HOST=${4-localhost}
          WP_VERSION=${5-latest}
          SKIP_DB_CREATE=${6-false}
          
          WP_TESTS_DIR=${WP_TESTS_DIR-/tmp/wordpress-tests-lib}
          WP_CORE_DIR=${WP_CORE_DIR-/tmp/wordpress/}
          
          # Only the isolated GitHub service database is in scope.
          [[ $DB_NAME == wordpress_test && $DB_HOST == 127.0.0.1:3306 ]]
          [[ $SKIP_DB_CREATE == true || $SKIP_DB_CREATE == false ]]

          download() {
              curl --fail --silent --show-error --location \
                  --proto '=https' --proto-redir '=https' \
                  --connect-timeout 20 --max-time 180 --retry 3 \
                  "$1" --output "$2"
              test -s "$2"
          }

          if [[ $WP_VERSION == latest ]]; then
              download https://api.wordpress.org/core/version-check/1.7/ /tmp/wp-latest.json
              WP_VERSION=$(php -r '
                  $data = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
                  $versions = [];
                  foreach ($data["offers"] ?? [] as $offer) {
                      if (($offer["response"] ?? null) !== "upgrade") {
                          continue;
                      }
                      $version = $offer["current"] ?? null;
                      if (!is_string($version) || !preg_match("/\A[0-9]+\.[0-9]+(?:\.[0-9]+)?\z/", $version)) {
                          throw new RuntimeException("Invalid stable WordPress offer.");
                      }
                      $versions[$version] = true;
                  }
                  if (count($versions) !== 1) {
                      throw new RuntimeException("Expected exactly one stable WordPress release.");
                  }
                  echo array_key_first($versions);
              ' /tmp/wp-latest.json)
          fi

          if [[ $WP_VERSION =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              WP_TESTS_TAG="tags/$WP_VERSION"
          elif [[ $WP_VERSION == nightly || $WP_VERSION == trunk ]]; then
              WP_TESTS_TAG=trunk
          else
              echo "Invalid WordPress version selector" >&2
              exit 1
          fi
          WP_SOURCE_URL="https://develop.svn.wordpress.org/$WP_TESTS_TAG"
          WP_REVISION=$(svn info --non-interactive --show-item revision "$WP_SOURCE_URL")
          [[ $WP_REVISION =~ ^[0-9]+$ ]]

          install_wp() {
              # Do not silently reuse a partial install.
              [[ ! -e $WP_CORE_DIR && ! -L $WP_CORE_DIR ]]
              if [[ $WP_TESTS_TAG == trunk ]]; then
                  # Nightly core and test fixtures use one immutable SVN snapshot.
                  svn export --non-interactive --quiet -r "$WP_REVISION" \
                      "$WP_SOURCE_URL/src@$WP_REVISION" "$WP_CORE_DIR"
              else
                  mkdir -p "$WP_CORE_DIR"
                  download "https://wordpress.org/wordpress-$WP_VERSION.tar.gz" /tmp/wordpress.tar.gz
                  tar --strip-components=1 -zxf /tmp/wordpress.tar.gz -C "$WP_CORE_DIR"
              fi

              # setup-php supplies native mysqli; never fetch a mutable third-party db.php.
              php -r 'exit(extension_loaded("mysqli") ? 0 : 1);'
              test ! -e "$WP_CORE_DIR/wp-content/db.php"
              CORE_VERSION=$(php -r 'require $argv[1]; echo $wp_version;' "$WP_CORE_DIR/wp-includes/version.php")
              SOURCE_VERSION=$(svn cat --non-interactive -r "$WP_REVISION" \
                  "$WP_SOURCE_URL/src/wp-includes/version.php@$WP_REVISION" |
                  php -r '$source = stream_get_contents(STDIN); if (!preg_match("/\\\$wp_version\s*=\s*\x27([^\x27]+)\x27/", $source, $match)) { exit(1); } echo $match[1];')
              [[ ${CORE_VERSION%-src} == "${SOURCE_VERSION%-src}" ]]
              if [[ $WP_TESTS_TAG != trunk ]]; then
                  [[ ${CORE_VERSION%-src} == "$WP_VERSION" ]]
              fi
              mkdir -p "$RUNNER_TEMP/sse-diagnostics"
              printf 'core=%s\nsource=%s\nrevision=%s\n' "$CORE_VERSION" "$WP_TESTS_TAG" "$WP_REVISION" \
                  > "$RUNNER_TEMP/sse-diagnostics/wordpress.txt"
          }

          install_test_suite() {
              [[ ! -e $WP_TESTS_DIR && ! -L $WP_TESTS_DIR ]]
              mkdir -p "$WP_TESTS_DIR"
              svn co --non-interactive --quiet -r "$WP_REVISION" \
                  "$WP_SOURCE_URL/tests/phpunit/includes@$WP_REVISION" "$WP_TESTS_DIR/includes"
              svn co --non-interactive --quiet -r "$WP_REVISION" \
                  "$WP_SOURCE_URL/tests/phpunit/data@$WP_REVISION" "$WP_TESTS_DIR/data"

              if [ ! -f "$WP_TESTS_DIR/wp-tests-config.php" ]; then
                  svn cat --non-interactive -r "$WP_REVISION" \
                      "$WP_SOURCE_URL/wp-tests-config-sample.php@$WP_REVISION" \
                      > "$WP_TESTS_DIR/wp-tests-config.php"
                  export WP_TESTS_DIR WP_CORE_DIR DB_NAME DB_USER DB_PASS DB_HOST
                  # Quote PHP literals safely; do not interpolate credentials through sed.
                  php -r '
                      $path = getenv("WP_TESTS_DIR") . "/wp-tests-config.php";
                      $config = file_get_contents($path);
                      $replacements = [
                          "dirname( __FILE__ ) . \x27/src/\x27" => rtrim(getenv("WP_CORE_DIR"), "/") . "/",
                          "\x27youremptytestdbnamehere\x27" => getenv("DB_NAME"),
                          "\x27yourusernamehere\x27" => getenv("DB_USER"),
                          "\x27yourpasswordhere\x27" => getenv("DB_PASS"),
                          "\x27localhost\x27" => getenv("DB_HOST"),
                      ];
                      foreach ($replacements as $needle => $value) {
                          if (substr_count($config, $needle) !== 1) {
                              throw new RuntimeException("Unexpected WordPress test config template.");
                          }
                          $config = str_replace($needle, var_export($value, true), $config);
                      }
                      if (file_put_contents($path, $config) !== strlen($config)) {
                          throw new RuntimeException("Cannot write WordPress test config.");
                      }
                  '
              fi
          }

          install_db() {
              if [[ $SKIP_DB_CREATE == true ]]; then
                  return
              fi
              # Fallback is limited to this job's disposable service and never drops a DB.
              MYSQL_PWD="$DB_PASS" mysql --user="$DB_USER" --host=127.0.0.1 --port=3306 \
                  -e 'CREATE DATABASE wordpress_test'
          }

          install_wp
          install_test_suite
          install_db
          EOF
          chmod +x tests/bin/install-wp-tests.sh

      - name: Create Bootstrap File
        id: create_bootstrap_file
        run: |
          mkdir -p tests
          cat > tests/bootstrap.php << 'EOF'
          <?php
          /**
           * PHPUnit bootstrap file for plugin tests.
           *
           * @package EngineScript_Site_Exporter
           */
          
          define( 'WP_TESTS_PHPUNIT_POLYFILLS_PATH', dirname( __DIR__ ) . '/vendor/yoast/phpunit-polyfills' );
          require_once '/tmp/wordpress-tests-lib/includes/functions.php';
          
          function _manually_load_plugin() {
              add_filter('widgets_init', function() {
                  return;
              }, 0);
              
              require dirname( dirname( __FILE__ ) ) . '/enginescript-site-exporter.php';
          }
          
          tests_add_filter( 'muplugins_loaded', '_manually_load_plugin' );
          
          require '/tmp/wordpress-tests-lib/includes/bootstrap.php';
          EOF

      - name: Create Test File
        id: create_test_file
        run: |
          cat > tests/EngineScriptSiteExporterTest.php << 'EOF'
          <?php
          /**
           * Class EngineScriptSiteExporterTest
           *
           * @package EngineScript_Site_Exporter
           */
          
          class EngineScriptSiteExporterTest extends WP_UnitTestCase {
              public function tear_down() {
                  sse_clear_current_export_lease();
                  wp_set_current_user(0);
                  parent::tear_down();
              }

              public function test_export_capability_boundary() {
                  wp_set_current_user(0);
                  $this->assertFalse(sse_current_user_can_export_site());
                  $subscriber = self::factory()->user->create(['role' => 'subscriber']);
                  wp_set_current_user($subscriber);
                  $this->assertFalse(sse_current_user_can_export_site());
                  $admin = self::factory()->user->create(['role' => 'administrator']);
                  wp_set_current_user($admin);
                  $this->assertSame(!is_multisite(), sse_current_user_can_export_site());
              }

              public function test_lease_ownership_and_conflict() {
                  $lease = sse_acquire_export_lease();
                  $this->assertIsArray($lease);
                  try {
                      $conflict = sse_acquire_export_lease();
                      $this->assertWPError($conflict);
                      $this->assertSame('export_lease_conflict', $conflict->get_error_code());
                      $wrong = $lease;
                      $wrong['owner'] = wp_generate_uuid4();
                      $this->assertFalse(sse_release_export_lease($wrong));
                      $this->assertSame($lease, sse_get_stored_export_lease());
                      sse_set_current_export_lease($lease);
                      $this->assertTrue(sse_renew_current_export_lease(true));
                  } finally {
                      sse_release_export_lease(sse_get_current_export_lease() ?? $lease);
                  }
                  $this->assertNull(sse_get_stored_export_lease());
              }

              public function test_stale_owner_cannot_release_replacement() {
                  $old = sse_acquire_export_lease();
                  $this->assertIsArray($old);
                  $this->assertTrue(sse_release_export_lease($old));
                  $new = sse_acquire_export_lease();
                  $this->assertIsArray($new);
                  try {
                      $this->assertFalse(sse_release_export_lease($old));
                      $this->assertSame($new, sse_get_stored_export_lease());
                  } finally {
                      sse_release_export_lease($new);
                  }
              }

              public function test_logs_expire_without_new_append() {
                  update_option('sse_error_logs', 'malformed', false);
                  sse_prune_expired_stored_logs();
                  $this->assertSame([], get_option('sse_error_logs'));
                  sse_store_log_in_database('test record', 'error');
                  $logs = get_option('sse_error_logs');
                  $this->assertCount(1, $logs);
                  $logs[0]['time'] = time() - 8 * DAY_IN_SECONDS;
                  update_option('sse_error_logs', $logs, false);
                  $this->assertSame(1, sse_prune_expired_stored_logs());
                  $this->assertSame([], get_option('sse_error_logs'));
              }

              public function test_cleanup_schedule_is_idempotent() {
                  $path = '/tmp/sse-test-' . wp_generate_uuid4() . '/fixture.zip';
                  try {
                      sse_schedule_export_cleanup($path);
                      $first = wp_next_scheduled('sse_delete_export_file', [$path]);
                      $this->assertIsInt($first);
                      sse_schedule_export_cleanup($path);
                      $this->assertSame($first, wp_next_scheduled('sse_delete_export_file', [$path]));
                      $this->assertSame(1, wp_clear_scheduled_hook('sse_delete_export_file', [$path]));
                      $this->assertFalse(wp_next_scheduled('sse_delete_export_file', [$path]));
                  } finally {
                      wp_clear_scheduled_hook('sse_delete_export_file', [$path]);
                  }
              }

              public function test_stored_logs_are_bounded_and_redacted() {
                  delete_option('sse_error_logs');
                  for ($index = 0; $index < 25; ++$index) {
                      sse_store_log_in_database('record ' . $index . ' ' . ABSPATH . 'private.sql', 'ERROR!');
                  }
                  $logs = get_option('sse_error_logs');
                  $this->assertCount(20, $logs);
                  $this->assertStringStartsWith('record 5 ', $logs[0]['message']);
                  foreach ($logs as $log) {
                      $this->assertSame('error', $log['level']);
                      $this->assertStringNotContainsString(ABSPATH, $log['message']);
                      $this->assertStringNotContainsString('private.sql', $log['message']);
                  }
                  $this->assertLessThanOrEqual(1000, strlen(sse_sanitize_stored_log_message(str_repeat('x', 2000))));
              }

              public function test_private_directory_contract_rejects_legacy_and_traversal() {
                  $valid = sse_generate_private_export_directory_name();
                  $this->assertTrue(sse_validate_export_directory_name_format($valid));
                  foreach (['', '.', '..', '../' . $valid, $valid . '/child', $valid . '\\child', 'legacy-export'] as $invalid) {
                      $error = sse_validate_export_directory_name_format($invalid);
                      $this->assertWPError($error);
                      $this->assertSame('invalid_export_directory', $error->get_error_code());
                  }
              }

              public function test_direct_filesystem_global_boundary() {
                  require_once ABSPATH . 'wp-admin/includes/class-wp-filesystem-base.php';
                  require_once ABSPATH . 'wp-admin/includes/class-wp-filesystem-direct.php';
                  $existed = array_key_exists('wp_filesystem', $GLOBALS);
                  $previous = $GLOBALS['wp_filesystem'] ?? null;
                  try {
                      foreach ([null, false, 'invalid', new stdClass()] as $invalid) {
                          $GLOBALS['wp_filesystem'] = $invalid;
                          $this->assertNull(sse_get_direct_global_filesystem());
                      }
                      $direct = new WP_Filesystem_Direct(null);
                      $GLOBALS['wp_filesystem'] = $direct;
                      $this->assertSame($direct, sse_get_direct_global_filesystem());
                  } finally {
                      if ($existed) {
                          $GLOBALS['wp_filesystem'] = $previous;
                      } else {
                          unset($GLOBALS['wp_filesystem']);
                      }
                  }
              }

              public function test_filepath_rejects_symlink_escape() {
                  $root = sys_get_temp_dir() . '/sse-test-' . wp_generate_uuid4();
                  $this->assertTrue(mkdir($root, 0700));
                  $this->assertTrue(mkdir($root . '/allowed', 0700));
                  $outside = $root . '/outside.zip';
                  $link = $root . '/allowed/escape.zip';
                  try {
                      $this->assertSame(7, file_put_contents($outside, 'fixture'));
                      $this->assertTrue(symlink($outside, $link));
                      $this->assertTrue(sse_validate_filepath($outside, $root));
                      $this->assertFalse(sse_validate_filepath($link, $root . '/allowed'));
                      $this->assertSame('fixture', file_get_contents($outside));
                  } finally {
                      if (is_link($link)) {
                          unlink($link);
                      }
                      if (is_file($outside)) {
                          unlink($outside);
                      }
                      rmdir($root . '/allowed');
                      rmdir($root);
                  }
              }

              public function test_plugin_loaded() {
                  $this->assertTrue(function_exists('sse_admin_menu'), 'Plugin was not loaded correctly');
              }

              public function test_plugin_hooks_registered() {
                  $this->assertSame(10, has_action('admin_menu', 'sse_admin_menu'));
                  $this->assertSame(10, has_action('network_admin_menu', 'sse_network_admin_menu'));
                  $this->assertSame(10, has_action('sse_recover_expired_export', 'sse_recover_expired_export_handler'));
                  $this->assertSame(10, has_action('sse_export_housekeeping', 'sse_export_housekeeping_handler'));
                  $this->assertSame(10, has_action('admin_enqueue_scripts', 'sse_enqueue_admin_assets'));
                  $this->assertSame(10, has_action('admin_post_sse_export_site', 'sse_handle_export'));
                  $this->assertSame(10, has_action('admin_post_sse_secure_download', 'sse_handle_secure_download'));
                  $this->assertSame(10, has_action('admin_post_sse_delete_export', 'sse_handle_export_deletion'));
                  $this->assertSame(10, has_action('sse_delete_export_file', 'sse_delete_export_file_handler'));
                  $this->assertSame(10, has_action('sse_bulk_cleanup_exports', 'sse_bulk_cleanup_exports_handler'));
              }

              public function test_plugin_constants_defined() {
                  $this->assertTrue(defined('ES_SITE_EXPORTER_VERSION'));
                  $this->assertTrue(defined('SSE_ALLOWED_EXTENSIONS'));
                  $this->assertTrue(defined('SSE_EXPORT_DIR_NAME'));
                  $this->assertTrue(defined('SSE_FILTER_MAX_FILE_SIZE'));

                  $this->assertNotEmpty(ES_SITE_EXPORTER_VERSION);
                  $this->assertSame(['zip'], SSE_ALLOWED_EXTENSIONS);
                  $this->assertSame('enginescript-site-exporter-exports', SSE_EXPORT_DIR_NAME);
                  $this->assertSame('sse_max_file_size_for_export', SSE_FILTER_MAX_FILE_SIZE);
              }

              public function test_security_helper_allows_only_zip_extension() {
                  $this->assertTrue(sse_validate_file_extension('site_enginescript_site_export_20260513_123456.zip'));
                  $this->assertFalse(sse_validate_file_extension('site_enginescript_site_export_20260513_123456.php'));
                  $this->assertFalse(sse_validate_file_extension('site_enginescript_site_export_20260513_123456.sql'));
                  $this->assertFalse(sse_validate_file_extension('site_enginescript_site_export_20260513_123456.tar.gz'));
              }

              public function test_export_filename_format_validation() {
                  $this->assertTrue(sse_validate_filename_format('site_enginescript_site_export_20260513_123456.zip'));
                  $this->assertInstanceOf(WP_Error::class, sse_validate_filename_format('../site_enginescript_site_export_20260513_123456.zip'));
                  $this->assertInstanceOf(WP_Error::class, sse_validate_filename_format('site_enginescript_site_export_20260513_123456.php'));
                  $this->assertInstanceOf(WP_Error::class, sse_validate_filename_format('site_export.zip'));
              }

              public function test_filepath_validation_rejects_traversal() {
                  $base_dir = sys_get_temp_dir() . '/sse-test-' . wp_generate_uuid4();
                  $this->assertTrue(mkdir($base_dir, 0700));
                  $file = $base_dir . '/site_enginescript_site_export_20260513_123456.zip';
                  try {
                      $this->assertSame(7, file_put_contents($file, 'fixture'));
                      $this->assertTrue(sse_validate_filepath($file, $base_dir));
                      $this->assertFalse(sse_validate_filepath($base_dir . '/../' . basename($file), $base_dir));
                  } finally {
                      if (is_file($file)) {
                          unlink($file);
                      }
                      rmdir($base_dir);
                  }
              }
              
              public function test_wordpress_version_compatibility() {
                  global $wp_version;
                  $this->assertNotEmpty($wp_version, 'WordPress version should be available');
                  
                  // Test that we're running on a supported WordPress version
                  $min_wp_version = '6.8';
                  $this->assertTrue(version_compare(preg_replace('/-src$/', '', $wp_version), $min_wp_version, '>='),
                      "WordPress version {$wp_version} should be >= {$min_wp_version}");
              }
          }
          EOF

      - name: Create PHPUnit Config
        id: create_phpunit_config
        run: |
          cat > phpunit.xml << 'EOF'
          <?xml version="1.0"?>
          <phpunit
              bootstrap="tests/bootstrap.php"
              backupGlobals="false"
              colors="true"
              failOnEmptyTestSuite="true"
              failOnRisky="true"
              failOnWarning="true"
          >
              <testsuites>
                  <testsuite name="EngineScript Site Exporter">
                      <directory suffix="Test.php">./tests/</directory>
                  </testsuite>
              </testsuites>
          </phpunit>
          EOF

      - name: Setup WP Tests
        id: setup_wp_tests
        timeout-minutes: 15
        run: |
          bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp-version }} true

      - name: Run plugin test
        id: run_plugin_test
        run: |
          mkdir -p "$RUNNER_TEMP/sse-diagnostics"
          vendor/bin/phpunit --config phpunit.xml --log-junit "$RUNNER_TEMP/sse-diagnostics/junit.xml"
          # Prove that the real generated config rejects an empty filtered suite.
          if vendor/bin/phpunit --config phpunit.xml --do-not-cache-result \
            --filter '__sse_intentionally_no_matching_test__' \
            > "$RUNNER_TEMP/sse-empty-suite.txt" 2>&1; then
            echo '::error::An empty test suite incorrectly succeeded.'
            exit 1
          else
            status=$?
            [[ $status == 1 ]]
            grep -q 'No tests executed' "$RUNNER_TEMP/sse-empty-suite.txt"
          fi
          # This control must fail due to its assertion, not a setup/parse error.
          cat > "$RUNNER_TEMP/SseIntentionalFailureTest.php" << 'EOF'
          <?php
          final class SseIntentionalFailureTest extends PHPUnit\Framework\TestCase {
              public function test_intentional_failure(): void {
                  $this->assertTrue(false, 'SSE intentional assertion control');
              }
          }
          EOF
          if vendor/bin/phpunit --no-configuration --do-not-cache-result \
            "$RUNNER_TEMP/SseIntentionalFailureTest.php" \
            > "$RUNNER_TEMP/sse-failing-suite.txt" 2>&1; then
            echo '::error::An intentionally failing assertion incorrectly succeeded.'
            exit 1
          else
            status=$?
            [[ $status == 1 ]]
            grep -q 'SSE intentional assertion control' "$RUNNER_TEMP/sse-failing-suite.txt"
          fi
          echo 'Empty-suite and intentional-assertion controls failed as expected.'

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php=${{ steps.setup_php.outcome }}
            use_isolated_composer_auth=${{ steps.use_isolated_composer_auth.outcome }}
            php_syntax_lint=${{ steps.php_syntax_lint.outcome }}
            install_subversion=${{ steps.install_subversion.outcome }}
            install_composer_dependencies=${{ steps.install_composer_dependencies.outcome }}
            pin_phpunit_for_wordpress_test_suite=${{ steps.pin_phpunit_for_wordpress_test_suite.outcome }}
            verify_phpunit_dependency_versions=${{ steps.verify_phpunit_dependency_versions.outcome }}
            prepare_database=${{ steps.prepare_database.outcome }}
            create_tests_directory_structure=${{ steps.create_tests_directory_structure.outcome }}
            create_wp_tests_install_script=${{ steps.create_wp_tests_install_script.outcome }}
            create_bootstrap_file=${{ steps.create_bootstrap_file.outcome }}
            create_test_file=${{ steps.create_test_file.outcome }}
            create_phpunit_config=${{ steps.create_phpunit_config.outcome }}
            setup_wp_tests=${{ steps.setup_wp_tests.outcome }}
            run_plugin_test=${{ steps.run_plugin_test.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/sse-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/sse-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/sse-diagnostics/run.txt"
          if command -v php >/dev/null; then
            php -r 'echo PHP_VERSION, PHP_EOL;' > "$RUNNER_TEMP/sse-diagnostics/php.txt"
          fi
          if command -v composer >/dev/null && [ -f vendor/composer/installed.json ]; then
            php -r '$data = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($data["packages"] ?? $data as $package) { echo $package["name"], " ", $package["version"], PHP_EOL; }' > "$RUNNER_TEMP/sse-diagnostics/dependencies.txt"
          fi
          # Never upload config, authentication data, SQL, exports, or arbitrary logs.
          # Refuse oversized or linked diagnostics instead of uploading them.
          find "$RUNNER_TEMP/sse-diagnostics" -type l -delete
          find "$RUNNER_TEMP/sse-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: wp-compat-${{ matrix.php-version }}-${{ matrix.wp-version }}-${{ matrix.dependency-versions }}
          path: |
            ${{ runner.temp }}/sse-diagnostics/run.txt
            ${{ runner.temp }}/sse-diagnostics/steps.txt
            ${{ runner.temp }}/sse-diagnostics/php.txt
            ${{ runner.temp }}/sse-diagnostics/dependencies.txt
            ${{ runner.temp }}/sse-diagnostics/wordpress.txt
            ${{ runner.temp }}/sse-diagnostics/junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Report test status
        id: report_test_status
        if: ${{ always() }}
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Tests passed successfully on PHP ${{ matrix.php-version }} with WordPress ${{ matrix.wp-version }}"
          else
            echo "❌ Tests failed on PHP ${{ matrix.php-version }} with WordPress ${{ matrix.wp-version }}"
          fi

      - name: Ensure repository files available after failure
        id: ensure_repository_files_available_after_failure
        if: ${{ failure() }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create issue on test failure
        id: create_issue_on_test_failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_STAGE: ${{ steps.checkout_code.outcome == 'failure' && 'checkout_code' || steps.setup_php.outcome == 'failure' && 'setup_php' || steps.use_isolated_composer_auth.outcome == 'failure' && 'use_isolated_composer_auth' || steps.php_syntax_lint.outcome == 'failure' && 'php_syntax_lint' || steps.install_subversion.outcome == 'failure' && 'install_subversion' || steps.install_composer_dependencies.outcome == 'failure' && 'install_composer_dependencies' || steps.pin_phpunit_for_wordpress_test_suite.outcome == 'failure' && 'pin_phpunit_for_wordpress_test_suite' || steps.verify_phpunit_dependency_versions.outcome == 'failure' && 'verify_phpunit_dependency_versions' || steps.prepare_database.outcome == 'failure' && 'prepare_database' || steps.create_tests_directory_structure.outcome == 'failure' && 'create_tests_directory_structure' || steps.create_wp_tests_install_script.outcome == 'failure' && 'create_wp_tests_install_script' || steps.create_bootstrap_file.outcome == 'failure' && 'create_bootstrap_file' || steps.create_test_file.outcome == 'failure' && 'create_test_file' || steps.create_phpunit_config.outcome == 'failure' && 'create_phpunit_config' || steps.setup_wp_tests.outcome == 'failure' && 'setup_wp_tests' || steps.run_plugin_test.outcome == 'failure' && 'run_plugin_test' || steps.report_test_status.outcome == 'failure' && 'report_test_status' || steps.ensure_repository_files_available_after_failure.outcome == 'failure' && 'ensure_repository_files_available_after_failure' || 'unknown_or_canceled' }}
          PHP_VERSION: ${{ matrix.php-version }}
          WP_VERSION: ${{ matrix.wp-version }}
          DEPENDENCY_VERSIONS: ${{ matrix.dependency-versions }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/wp-version-test-failure.md
          update_existing: false
